<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cookie's Cards · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #1F2A44; --soft: #3F4963; --butter: #FFE08A; --frame: #F4C95D; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--butter); color: var(--ink); font-family: 'Nunito Sans', system-ui, sans-serif; }
main { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; display: flex; flex-direction: column; gap: 24px; }
h1, h2 { font-family: 'Baloo 2', sans-serif; margin: 0; }
h1 { font-size: 30px; } h2 { font-size: 22px; }
.box { background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 18px; box-shadow: 0 5px 0 var(--ink); display: flex; flex-direction: column; gap: 12px; }
button, input { font-family: inherit; font-size: 15px; color: var(--ink); }
button { cursor: pointer; min-height: 44px; padding: 8px 14px; border: 2px solid var(--ink); border-radius: 12px; background: #fff; font-weight: 700; }
button.primary { background: var(--ink); color: #fff; }
button[disabled] { opacity: .5; }
input[type=text], input[type=password], input[type=date] { min-height: 44px; padding: 6px 12px; border: 2px solid var(--ink); border-radius: 12px; width: 100%; }
label { font-size: 13px; font-weight: 700; display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.c { background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pics figure { margin: 0; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; gap: 4px; }
.pics img, .pics video, .pics .none { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border: 2px solid var(--ink); border-radius: 8px; background: #D8DCE6; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; }
.tag { align-self: flex-start; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; border: 2px solid var(--ink); }
.tag.live { background: #BDEBC8; } .tag.draft { background: #fff; }
.err { color: #9B1C1C; font-weight: 700; font-size: 14px; margin: 0; }
.muted { color: var(--soft); font-size: 14px; margin: 0; }
table { border-collapse: collapse; width: 100%; } td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #D5DBE8; font-size: 14px; }
</style>
</head>
<body>
<main id="root"></main>
<script src="/admin.js" defer></script>
</body>
</html>
